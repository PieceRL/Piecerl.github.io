
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playing - The PieceRL Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1d;color:white;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#0d1930;display:flex;justify-content:space-between;align-items:center;gap:15px}
h2{color:#45a5ff;margin:0}
a{color:#70baff;text-decoration:none}
main{padding:20px}
#gameFrame{width:100%;height:calc(100vh - 150px);border:1px solid #234b7c;border-radius:12px;background:white}
#message{color:#a8bad0}
</style>
</head>
<body>
<header>
<h2>🎮 THE PIECERL GAMES</h2>
<a href="index.html">← Back to Games</a>
</header>
<main>
<h2 id="gameName">Loading game...</h2>
<p id="message">Please wait...</p>
<iframe id="gameFrame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<p><a id="openGame" target="_blank" rel="noopener">Open game in a new tab ↗</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const client=supabase.createClient(
  window.PIECERL_CONFIG.supabaseUrl,
  window.PIECERL_CONFIG.supabaseAnonKey
);
const id=new URLSearchParams(location.search).get("id");

async function loadGame(){
 if(!id){
  document.getElementById("message").textContent="No game was selected.";
  return;
 }
 const {data,error}=await client.from("games")
  .select("name,description,game_url,storage_path")
  .eq("id",id).single();

 if(error||!data){
  document.getElementById("message").textContent="Game not found.";
  return;
 }

 let url=data.game_url;
 if(data.storage_path && data.storage_path!=="external"){
  url=client.storage.from("games").getPublicUrl(data.storage_path).data.publicUrl;
 }

 document.title=data.name+" - The PieceRL Games";
 document.getElementById("gameName").textContent=data.name;
 document.getElementById("message").textContent=data.description||"Enjoy playing!";
 document.getElementById("gameFrame").src=url;
 document.getElementById("openGame").href=url;
}
loadGame();
</script>
</body>
</html>
