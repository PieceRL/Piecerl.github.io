
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The PieceRL Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1d;color:white;font-family:Arial,sans-serif}
header{padding:25px 6%;background:#0d1930;border-bottom:1px solid #173c70}
h1{margin:0;color:#45a5ff;font-size:30px}
header p{color:#9bb4d2;margin:8px 0 0}
main{max-width:1250px;margin:auto;padding:30px 20px}
.search{width:100%;padding:15px;border-radius:10px;border:1px solid #234b7c;background:#101e35;color:white;font-size:16px;margin-bottom:25px}
h2{color:#70baff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:#101d32;border:1px solid #1b3d68;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#399cff}
.thumb{height:145px;background:linear-gradient(135deg,#123d75,#087bba);display:flex;align-items:center;justify-content:center;font-size:48px}
.info{padding:15px}
.info h3{margin:0 0 8px}
.info p{color:#a8bad0;font-size:13px;min-height:32px}
.play{display:block;text-align:center;text-decoration:none;background:#1689ee;color:white;padding:11px;border-radius:8px;font-weight:bold}
.play:hover{background:#40a5ff}
.empty{color:#a8bad0}
</style>
</head>
<body>
<header>
<h1>🎮 THE PIECERL GAMES</h1>
<p>Play amazing games, all in one place.</p>
</header>
<main>
<input class="search" id="search" placeholder="🔎 Search games...">
<h2>All Games</h2>
<div class="grid" id="games">
<p class="empty">Loading games...</p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const client = supabase.createClient(
  window.PIECERL_CONFIG.supabaseUrl,
  window.PIECERL_CONFIG.supabaseAnonKey
);
const grid = document.getElementById("games");
let allGames = [];

async function loadGames(){
  const {data,error} = await client.from("games")
    .select("id,name,description,category,game_url,storage_path")
    .order("created_at",{ascending:false});

  if(error){
    grid.innerHTML='<p class="empty">Could not load games. Please try again later.</p>';
    return;
  }
  allGames=data||[];
  showGames(allGames);
}

function showGames(games){
  grid.innerHTML="";
  if(!games.length){
    grid.innerHTML='<p class="empty">No games published yet.</p>';
    return;
  }
  games.forEach(game=>{
    const url = game.storage_path && game.storage_path !== "external"
      ? client.storage.from("games").getPublicUrl(game.storage_path).data.publicUrl
      : game.game_url;
    const card=document.createElement("article");
    card.className="card";
    const thumb=document.createElement("div");
    thumb.className="thumb";
    thumb.textContent="🎮";
    const info=document.createElement("div");
    info.className="info";
    const title=document.createElement("h3");
    title.textContent=game.name;
    const description=document.createElement("p");
    description.textContent=game.description||game.category||"Play now!";
    const link=document.createElement("a");
    link.className="play";
    link.href="play.html?id="+encodeURIComponent(game.id);
    link.textContent="PLAY GAME";
    info.append(title,description,link);
    card.append(thumb,info);
    grid.append(card);
  });
}

document.getElementById("search").addEventListener("input",e=>{
  const term=e.target.value.toLowerCase();
  showGames(allGames.filter(g=>
    (g.name||"").toLowerCase().includes(term)||
    (g.category||"").toLowerCase().includes(term)
  ));
});
loadGames();
</script>
</body>
</html>
